{% extends 'base.html' %}
{% block content %}
{% load static %}

    <h1>Sign Up</h1>
    <p>If you already have an account, click <a href="{% url 'user.login' %}">here</a> to login</p>
    

    <form action="{% url 'user.get_new_user' %}" method="post">
        {% csrf_token %}
        {{ form }}
        <input type="submit" value="Submit">
    </form>
    
    
{% endblock content %}
