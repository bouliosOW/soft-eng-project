{% extends "base.html" %}

{% block content %}
<div class="container">
    <h1>Pregame Setup</h1>
    <p>Choose your preferred music category before starting the game:</p>
    
    <form method="get" action="{% url 'game' %}">
        <div class="btn-group" role="group">
            <button type="submit" name="category" value="all" class="btn btn-primary">All</button>
            <button type="submit" name="category" value="80s" class="btn btn-secondary">80s</button>
            <button type="submit" name="category" value="90s" class="btn btn-secondary">90s</button>
            <button type="submit" name="category" value="2000s" class="btn btn-secondary">2000s</button>
        </div>

        <br><br>
        <label for="practice">Practice Mode:</label>
        <input type="checkbox" id="practice" name="data" value="p">

        <br><br>
        <a href="{% url 'index' %}" class="btn btn-light">Back to Home</a>
    </form>

    {% if practice %}
        <p>You are in practice mode!</p>
    {% endif %}
</div>
{% endblock content %}
