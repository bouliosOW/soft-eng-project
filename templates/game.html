{% extends "base.html" %}
{% block content %}
{% load static %}

<p class="info-text">🎧 Listen To The Beat & Guess The Track!</p>

<!--  Audio Player -->
<audio controls id="audio-player">
    <source id="audio-source" src="{{ song.path }}" type="audio/mpeg">
</audio>

<!--  Control Buttons -->
<div class="button-group">
    <button class="start-btn" onclick="playAudio()">▶️ Play</button>
    <button class="start-btn" onclick="pauseAudio()">⏸️ Pause</button>
    <button class="start-btn" onclick="stopAudio()">⏹️ Stop</button>
    <button class="start-btn" onclick="restartAudio()">🔁 Restart</button>
</div>

<!--  Guessing Area -->
<div class="guessing-section">
    <!--  Guess Form -->
    <form onsubmit="checkAnswers(event)" class="guess-form form-box">
        <div class="mb-2">
            <label for="title">🎼 What is the song's title?</label>
            <input type="text" id="title" placeholder="Enter song title">
        </div>  
        <div class="mb-2">
            <label for="name">🧑‍🎤 What is the artist's name?</label>
            <input type="text" id="name" placeholder="Enter artist name">
        </div>
        <div class="mb-2">
            <label for="year">📅 What year was this song released?</label>
            <input type="number" id="year" placeholder="Enter release year">
        </div>
        <button class="action-btn" type="submit">🎯 Guess that Groove!</button>
    </form>

    <!--  Results -->
    <div class="guess-results">
    <p id="titleGuess">🎼 Title: ...</p>
    <p id="artistGuess">🧑‍🎤 Artist: ...</p>
    <p id="yearGuess">📅 Year: ...</p>
</div>
</div>

<a href="{% url 'game' %}" class="start-btn">🚀 Start Another Game</a>

<!--  Logic Stuff -->
<script>
    const audioPlayer = document.getElementById("audio-player");
    const audioSource = document.getElementById('audio-source');
    audioPlayer.style.display = "none";

    const song = {
        title: "{{ song.title|escapejs }}",
        artist: "{{ song.artist|escapejs }}",
        year: parseInt("{{ song.year|escapejs }}", 10),
        album: "{{ song.album|escapejs }}",
        path: "{{ song.path|escapejs }}"
    };

    let time = 5;

    audioPlayer.addEventListener("timeupdate", () => {
        if (audioPlayer.currentTime >= time) {
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
        }
    });

    function playAudio() {
        audioPlayer.play();
    }

    function pauseAudio() {
        audioPlayer.pause();
    }

    function stopAudio() {
        audioPlayer.pause();
        audioPlayer.style.display = 'none';
    }

    function restartAudio() {
        audioPlayer.currentTime = 0;
        audioPlayer.style.display = 'block';
    }

    const tG = document.getElementById("titleGuess");
    const aG = document.getElementById("artistGuess");
    const yG = document.getElementById("yearGuess");

    function checkAnswers(event) {
        event.preventDefault();

        const title = document.getElementById("title").value.trim().toLowerCase();
        const artist = document.getElementById("name").value.trim().toLowerCase();
        const year = parseInt(document.getElementById("year").value);

        const guesses = {
            title: title === song.title.toLowerCase(),
            artist: artist === song.artist.toLowerCase(),
            year: year === song.year
        };

        tG.textContent = `🎼 Title: ${guesses.title ? "✅ Correct!" : "❌ Incorrect"}`;
        aG.textContent = `🧑‍🎤 Artist: ${guesses.artist ? "✅ Correct!" : "❌ Incorrect"}`;
        yG.textContent = `📅 Year: ${guesses.year ? "✅ Correct!" : "❌ Incorrect"}`;

        time += 5;
    }
</script>

{% endblock content %}
