{% extends "base.html" %}
{% block content %}
{% load static %}

<div class="info-text">

    <h1 class="page-title">Welcome to Groove Guesser</h1>
    <p class="info-text">Create a new account or log in to start guessing some tunes!</p>

    <div class="signup-login-box">
        <!-- Sign Up Form -->
        <div class="form-box">
            <h2 class="text-white">Create Account</h2>
            <form action="{% url 'signup' %}" method="post">
                {% csrf_token %}
                <input id="username" type="text" name="username" placeholder="Username" required>
                <input id="password" type="password" name="password" placeholder="Password" required>
                <label for="" class="text-danger bg-white my-2"></label>
                <button type="submit" class="action-btn">Sign Up</button>
            </form>
        </div>

        <!-- Login Redirect thing -->
        <div class="form-box">
            <h2 class="text-white">Already Have an Account?</h2>
            <p class="text-white">Click below to log in:</p>
            <a href="{% url 'user.login' %}" class="action-btn alt-btn">Log In</a>
        </div>
    </div>

</div>

<script>
    const signupForm = document.querySelector('form')

    var accounts = JSON.parse('{{ accounts_json|safe }}' || '[]') 

    var label = document.querySelector('label')

    signupForm.addEventListener('submit', function(event) {
        let username = document.getElementById('username').value
        let password = document.getElementById('password').value

        if (username.length > 15 || username.length < 3) {
            event.preventDefault()
            label.textContent = "The username must be 3-15 characters in length (inclusive)."
        }
        else if (password.length > 20 || password.length < 5) {
            event.preventDefault()
            label.textContent = "The password must be 3-20 characters in length (inclusive)."
        }
        else {
            event.preventDefault()

            let formData = new FormData(this);

            fetch("{% url 'user.get_new_user' %}", {
                method: "POST",
                headers: {
                    "X-CSRFToken": document.querySelector("[name=csrfmiddlewaretoken]").value
                },
                body: formData
            })
            .then(response => response.clone().text())
            .then(rawText => JSON.parse(rawText))
            .then(data => {
                if(data.success) {
                    window.location.href = "{% url 'user.login' %}"
                }
                else {
                    label.textContent = data.message
                }
            })
            .catch(error => {
                label.textContent = "An Error Has Occured. Please Try Again."
                console.log("error:", error)
            })
        }
    })
</script>

{% endblock content %}
