<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ template_data.title }}</title>
    <link rel="stylesheet" href="{% static 'css/style.css'%}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">Navbar</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link " href="{% url 'index' %}">Main Menu</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="{% url 'pregame' %}">Game</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="{% url 'about' %}">About</a>
              </li>
              <li class="nav-item">
                <a href="{% url 'user.signup' %}" class="nav-link">Accounts</a>
              </li>
              <li class="nav-item">
                <a href="{% url 'leaderboard' %}" class="nav-link">Leaderboard</a>
              </li>

              {% if username %}
                <li class="nav-item">
                  <a href="{% url 'user.userHome' %}" class="nav-link">Dashboard</a>
                </li>
                <li class="nav-item">
                  <p>Hello, {{ username }}</p>
                </li>
                <li class="nav-item">
                  <div class="btn btn-primary" onclick="logout()">Log Out</div>
                </li>
              {% endif %}
            </ul>
          </div>
        </div>
      </nav>

    {% block content %}
    {% endblock content %}
</body>
</html>
